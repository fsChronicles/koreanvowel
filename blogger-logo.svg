<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Background Pattern -->
  <defs>
    <pattern id="bgPattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1" opacity="0.2"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgPattern)" />

  <!-- Main Logo Container -->
  <g transform="translate(50, 20)" filter="url(#shadow)">
    <!-- Book Shape -->
    <path d="M0,20 L240,20 L260,0 L300,0 L300,140 L260,140 L240,160 L0,160 Z" 
          fill="#1b3968" stroke="#1b3968" stroke-width="2"/>
    
    <!-- Inner Pages Accent -->
    <path d="M5,25 L235,25 L255,5 L295,5" 
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <path d="M5,30 L235,30 L255,10 L295,10" 
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Hangeul Elements (Centered Horizontally) -->
    <g transform="translate(40, 45)">
      <!-- First Row - Basic Vowels -->
      <text x="20" y="30" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">家</text>
      <text x="60" y="30" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">命:</text>
      <text x="100" y="30" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">熱</text>
      <text x="140" y="30" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">定:</text>
      
      <!-- Second Row - Long Vowels -->
      <text x="20" y="70" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">細:</text>
      <text x="60" y="70" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">私</text>
      <text x="100" y="70" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">畵:</text>
      <text x="140" y="70" font-family="Noto Sans KR" font-size="24" fill="#ffffff" text-anchor="middle">出</text>
      
      <!-- Decorative Line -->
      <line x1="170" y1="20" x2="170" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      
      <!-- Consonants -->
      <text x="190" y="40" font-family="Noto Sans KR" font-size="20" fill="#ffffff" text-anchor="start">ㄱㄷㅂㅇ</text>
      <text x="190" y="70" font-family="Noto Sans KR" font-size="20" fill="#ffffff" text-anchor="start">ㅁㅈㅌㅎ</text>
    </g>
  </g>
  
</svg>
